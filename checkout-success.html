<!doctype html>
<html lang="en">
<head>

  <style>
    :root{--bg:#0a0a0a;--panel:#151019;--muted:#a9a3b5;--purple:#7c3aed;--gold:#f59e0b;--green:#22c55e;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 25% 0,rgba(34,197,94,.16),transparent 28%),radial-gradient(circle at 90% 10%,rgba(124,58,237,.30),transparent 34%),var(--bg);color:#fff;font-family:Outfit,system-ui,sans-serif}.wrap{width:min(1000px,92vw);margin:auto;padding:36px 0}.logo{font-size:24px;font-weight:900}.logo span,.gold{color:var(--gold)}.hero{padding:56px 0;text-align:center}.check{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:auto;background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.45);font-size:38px}h1{font-size:clamp(38px,7vw,74px);line-height:.92;margin:18px 0;letter-spacing:-.06em}p{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.ticket{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:28px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px}.meta{color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.09em;font-weight:900}.ticket h3{margin:8px 0;font-size:24px}.qr{background:#fff;padding:12px;border-radius:16px;width:150px;height:150px}.btn{display:inline-flex;border:0;border-radius:999px;padding:13px 18px;font-weight:900;background:linear-gradient(135deg,var(--purple),#c026d3);color:#fff;text-decoration:none}.status{padding:22px;border:1px dashed var(--line);border-radius:22px;color:var(--muted)}@media(max-width:760px){.grid,.ticket{grid-template-columns:1fr}.qr{margin-top:10px}}
  </style>
</head>
<body><main class="wrap"><a class="logo" href="index.html">Tix<span>Wave</span>.party</a><section class="hero"><div class="check">✓</div><h1>You're on the list.</h1><p>Your Stripe payment is complete. Your QR ticket appears below as soon as the webhook finishes creating it.</p><a class="btn" href="my-tickets.html">View My Tickets</a></section><section><div id="status" class="status">Loading tickets...</div><div id="tickets" class="grid"></div></section></main>
<script>
const SUPABASE_URL='https://nmusxculduptvefgqfjn.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tdXN4Y3VsZHVwdHZlZmdxZmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjcwNDQsImV4cCI6MjEwNTY0MzA0NH0._Nn3nacYJOg2nLcG_kxNSI3vTWtDHUEEH11Lvsera8s';
const params=new URLSearchParams(location.search);const orderId=params.get('order_id');const token=params.get('token');const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{global:{headers:{'x-order-token':token||''}}});
function fmt(v){return new Date(v+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});}function makeCard(ticket){return `<article class="ticket"><div><div class="meta">${ticket.ticket_types?.name||'Ticket'} • ${ticket.ticket_ref}</div><h3>${ticket.events?.name||'TixWave.party Event'}</h3><p>${fmt(ticket.events?.date)}<br>${ticket.events?.venue||''} ${ticket.events?.city?`• ${ticket.events.city}`:''}</p><p class="gold">QR encodes ticket UUID for door scan.</p></div><div class="qr" id="qr-${ticket.id}"></div></article>`;}
async function loadTickets(attempt=1){if(!orderId||!token){status.textContent='Missing order token. Open this page from your Stripe success redirect.';return;}const {data,error}=await db.from('tickets').select('id,ticket_ref,used,events(name,date,venue,city,country),ticket_types(name)').eq('order_id',orderId);if(error){console.error(error);status.textContent='Could not load tickets yet. Check RLS policies and webhook setup.';return;}if(!data||data.length===0){status.textContent=attempt<8?'Waiting for Stripe webhook to issue tickets...':'No tickets found yet. If payment succeeded, check the ticket-webhook logs.';if(attempt<8)setTimeout(()=>loadTickets(attempt+1),2000);return;}status.style.display='none';tickets.innerHTML=data.map(makeCard).join('');data.forEach(t=>new QRCode(document.getElementById('qr-'+t.id),{text:t.id,width:126,height:126,correctLevel:QRCode.CorrectLevel.H}));}
loadTickets();
</script></body></html>
