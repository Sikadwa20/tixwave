<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tickets — TixWave.party</title>
  <meta name="description" content="View your TixWave.party QR tickets for upcoming and past events.">
  <meta property="og:url" content="https://tixwave.party/my-tickets.html">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0a;--muted:#a9a3b5;--purple:#7c3aed;--gold:#f59e0b;--green:#22c55e;--red:#ef4444;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.07)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(124,58,237,.28),transparent 32%),var(--bg);color:#fff;font-family:Outfit,system-ui,sans-serif}.wrap{width:min(1080px,92vw);margin:auto}.nav{border-bottom:1px solid var(--line)}.nav .wrap{display:flex;justify-content:space-between;align-items:center;padding:16px 0}.logo{font-size:24px;font-weight:900;color:white;text-decoration:none}.logo span{color:var(--gold)}h1{font-size:clamp(38px,7vw,72px);letter-spacing:-.06em;margin:36px 0 10px}.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--purple),#c026d3);cursor:pointer}.btn.secondary{background:var(--glass);border:1px solid var(--line)}input{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--glass);color:white;padding:14px;font:inherit}.auth,.ticket{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:26px;padding:20px}.auth{display:grid;grid-template-columns:1fr auto;gap:12px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:34px}.ticket{display:grid;grid-template-columns:1fr auto;gap:16px}.meta{color:var(--gold);font-weight:900;text-transform:uppercase;letter-spacing:.08em;font-size:13px}.muted{color:var(--muted)}.qr{background:#fff;padding:12px;border-radius:16px;width:142px;height:142px}.status{display:inline-flex;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px}.valid{background:rgba(34,197,94,.14);color:#86efac}.used{background:rgba(239,68,68,.14);color:#fca5a5}.sectiontitle{margin-top:26px;color:#fff}@media(max-width:760px){.auth,.grid,.ticket{grid-template-columns:1fr}.qr{margin-top:10px}}
  </style>
</head>
<body><nav class="nav"><div class="wrap"><a class="logo" href="index.html">Tix<span>Wave</span>.party</a><button class="btn secondary" id="logoutBtn">Logout</button></div></nav><main class="wrap"><h1>Your QR tickets</h1><p class="muted">Sign in with the same email used at checkout. Supabase sends a secure magic link.</p><div class="auth" id="authBox"><input id="email" type="email" placeholder="you@example.com"><button class="btn" id="loginBtn">Send login link</button></div><p id="msg" class="muted"></p><h2 class="sectiontitle">Upcoming</h2><div id="upcoming" class="grid"></div><h2 class="sectiontitle">Past events</h2><div id="past" class="grid"></div></main>
<script>
const SUPABASE_URL='https://nmusxculduptvefgqfjn.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tdXN4Y3VsZHVwdHZlZmdxZmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjcwNDQsImV4cCI6MjEwNTY0MzA0NH0._Nn3nacYJOg2nLcG_kxNSI3vTWtDHUEEH11Lvsera8s';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);function fmt(v){return new Date(v+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});}function card(t){const used=t.used?'used':'valid';return `<article class="ticket"><div><div class="meta">${t.ticket_types?.name||'Ticket'} • ${t.ticket_ref}</div><h3>${t.events?.name||'TixWave.party Event'}</h3><p class="muted">${fmt(t.events?.date)}<br>${t.events?.venue||''} ${t.events?.city?`• ${t.events.city}`:''}</p><span class="status ${used}">${used.toUpperCase()}</span></div><div class="qr" id="qr-${t.id}"></div></article>`;}
async function load(){const {data:{session}}=await db.auth.getSession();if(!session){msg.textContent='You are not logged in yet.';upcoming.innerHTML=past.innerHTML='';return;}authBox.style.display='none';msg.textContent=`Logged in as ${session.user.email}`;const {data,error}=await db.from('tickets').select('id,ticket_ref,used,events(name,date,venue,city,country),ticket_types(name)').order('created_at',{ascending:false});if(error){console.error(error);msg.textContent='Could not load your tickets. Confirm RLS and that you used the same checkout email.';return;}const today=new Date().toISOString().slice(0,10);const up=(data||[]).filter(t=>(t.events?.date||'')>=today);const old=(data||[]).filter(t=>(t.events?.date||'')<today);upcoming.innerHTML=up.length?up.map(card).join(''):'<p class="muted">No upcoming tickets yet.</p>';past.innerHTML=old.length?old.map(card).join(''):'<p class="muted">No past tickets yet.</p>';[...up,...old].forEach(t=>new QRCode(document.getElementById('qr-'+t.id),{text:t.id,width:118,height:118,correctLevel:QRCode.CorrectLevel.H}));}
loginBtn.onclick=async()=>{const clean=email.value.trim();if(!clean.includes('@')){msg.textContent='Enter a valid email.';return;}const {error}=await db.auth.signInWithOtp({email:clean,options:{emailRedirectTo:location.href}});msg.textContent=error?error.message:'Magic link sent. Open it on this device to view your tickets.';};logoutBtn.onclick=async()=>{await db.auth.signOut();location.reload();};load();
</script></body></html>
