<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Tickets — TixWave.party</title>
  <meta name="description" content="Buy nightclub and live event tickets on TixWave.party with Stripe checkout and QR code entry.">
  <meta property="og:url" content="https://tixwave.party/event.html">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0a;--panel:#151019;--muted:#a9a3b5;--purple:#7c3aed;--gold:#f59e0b;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.07)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,rgba(124,58,237,.28),transparent 34%),var(--bg);color:white;font-family:Outfit,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,92vw);margin:auto}.nav{border-bottom:1px solid var(--line);background:rgba(10,10,10,.75);backdrop-filter:blur(18px);position:sticky;top:0;z-index:3}.nav .wrap{display:flex;justify-content:space-between;align-items:center;padding:16px 0}.logo{font-weight:900;font-size:24px;letter-spacing:-.04em}.logo span{color:var(--gold)}.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--purple),#c026d3);cursor:pointer}.btn.secondary{background:var(--glass);border:1px solid var(--line)}.hero{display:grid;grid-template-columns:1fr .9fr;gap:34px;padding:44px 0}.banner{border-radius:34px;min-height:440px;background:center/cover;border:1px solid var(--line);box-shadow:0 40px 120px rgba(0,0,0,.55)}.meta{color:var(--gold);font-weight:900;text-transform:uppercase;letter-spacing:.09em}h1{font-size:clamp(42px,7vw,82px);line-height:.9;margin:14px 0;letter-spacing:-.06em}p{color:var(--muted);line-height:1.6;font-size:18px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.detail,.ticket,.modalbox{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:22px;padding:18px}.detail b{display:block;color:#fff}.tickets{display:grid;gap:14px}.ticket{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.price{font-size:32px;font-weight:900;color:var(--gold)}.remaining{color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.07);color:white;padding:14px;font:inherit}.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.72);padding:20px}.modal.open{display:grid}.modalbox{max-width:470px;width:100%;box-shadow:0 30px 90px rgba(0,0,0,.65)}.row{display:grid;gap:12px;margin:14px 0}.note{font-size:14px;color:var(--muted)}@media(max-width:820px){.hero,.details{grid-template-columns:1fr}.banner{min-height:290px}.ticket{grid-template-columns:1fr}.nav .wrap{gap:12px}.nav a:not(.logo){font-size:14px}}
  </style>
</head>
<body>
<nav class="nav"><div class="wrap"><a class="logo" href="index.html">Tix<span>Wave</span>.party</a><div><a class="btn secondary" href="my-tickets.html">My Tickets</a></div></div></nav>
<main class="wrap"><section class="hero"><div><div id="meta" class="meta">Loading event...</div><h1 id="eventName">TixWave.party Event</h1><p id="description"></p><div class="details"><div class="detail"><span class="meta">Date</span><b id="eventDate">—</b></div><div class="detail"><span class="meta">Venue</span><b id="venue">—</b></div><div class="detail"><span class="meta">Location</span><b id="location">—</b></div></div></div><div id="banner" class="banner"></div></section><section><div class="meta">Choose your access</div><h2>Ticket types</h2><div id="tickets" class="tickets"></div></section></main>
<div class="modal" id="buyModal"><div class="modalbox"><h2>Complete your ticket order</h2><p id="selectedTicket" class="note"></p><div class="row"><input id="buyerEmail" type="email" placeholder="Buyer email for ticket delivery"><select id="quantity"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><button class="btn" id="payBtn">Continue to Stripe</button> <button class="btn secondary" id="closeBtn">Cancel</button><p id="checkoutMsg" class="note"></p></div></div>
<script>
const SUPABASE_URL='https://nmusxculduptvefgqfjn.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tdXN4Y3VsZHVwdHZlZmdxZmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjcwNDQsImV4cCI6MjEwNTY0MzA0NH0._Nn3nacYJOg2nLcG_kxNSI3vTWtDHUEEH11Lvsera8s';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const fn=`${SUPABASE_URL}/functions/v1/create-ticket-checkout`;const id=new URLSearchParams(location.search).get('id');let selected=null;let eventData=null;const fallback='https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=80';
function fmtDate(v,t){const d=new Date(v+'T'+(t||'00:00'));return d.toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric',hour:t?'numeric':undefined,minute:t?'2-digit':undefined});}function eur(v){return new Intl.NumberFormat(undefined,{style:'currency',currency:'EUR'}).format(v||0);}function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
async function load(){if(!id){tickets.innerHTML='<div class="ticket">Missing event ID.</div>';return;}const eventRes=await db.from('events').select('*').eq('id',id).single();if(eventRes.error){tickets.innerHTML='<div class="ticket">Event not found.</div>';return;}eventData=eventRes.data;eventName.textContent=eventData.name;description.textContent=eventData.description||'A premium live experience powered by TixWave QR tickets.';eventDate.textContent=fmtDate(eventData.date,eventData.time);venue.textContent=eventData.venue||'Venue TBA';location.textContent=[eventData.city,eventData.country].filter(Boolean).join(', ');meta.textContent=`${eventData.city||''} ${eventData.country||''}`;banner.style.backgroundImage=`linear-gradient(0deg,rgba(0,0,0,.38),rgba(0,0,0,.05)),url('${eventData.banner_url||fallback}')`;const tt=await db.from('ticket_types').select('id,name,price,quantity,sold,event_id').eq('event_id',id).order('price');if(tt.error){tickets.innerHTML='<div class="ticket">Could not load tickets.</div>';return;}tickets.innerHTML=(tt.data||[]).map(t=>{const left=t.quantity-(t.sold||0);return `<div class="ticket"><div><h3>${esc(t.name)}</h3><div class="remaining">${left} remaining • secure Stripe checkout</div></div><div><div class="price">${eur(t.price)}</div><button class="btn buy-ticket-btn" ${left<1?'disabled':''} data-ticket-id="${t.id}" data-ticket-name="${esc(t.name)}" data-ticket-price="${t.price}">${left<1?'Sold out':'Buy Tickets'}</button></div></div>`}).join('')||'<div class="ticket">Tickets are not available yet.</div>';document.querySelectorAll('.buy-ticket-btn').forEach(btn=>btn.onclick=()=>openBuy({id:btn.dataset.ticketId,name:btn.dataset.ticketName,price:Number(btn.dataset.ticketPrice)}));}
function openBuy(ticket){if(!ticket?.id){checkoutMsg.textContent='Ticket type is missing. Refresh the page and try again.';return;}selected=ticket;buyModal.dataset.ticketTypeId=ticket.id;selectedTicket.textContent=`${eventData.name} — ${ticket.name} at ${eur(ticket.price)} each`;buyModal.classList.add('open');checkoutMsg.textContent='';}
closeBtn.onclick=()=>buyModal.classList.remove('open');payBtn.onclick=async()=>{const email=buyerEmail.value.trim();const ticketTypeId=buyModal.dataset.ticketTypeId||selected?.id;if(!email.includes('@')){checkoutMsg.textContent='Enter a valid buyer email.';return;}if(!ticketTypeId){checkoutMsg.textContent='Ticket type is missing. Refresh the page and try again.';return;}payBtn.disabled=true;checkoutMsg.textContent='Creating your secure Stripe Checkout...';const res=await fetch(fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`},body:JSON.stringify({event_id:id,ticket_type_id:ticketTypeId,quantity:Number(quantity.value),buyer_email:email})});const data=await res.json();if(!res.ok){checkoutMsg.textContent=data.error||'Checkout failed.';payBtn.disabled=false;return;}location.href=data.url;};load();
</script>
</body>
</html>
