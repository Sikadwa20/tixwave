<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — TixWave.party</title>
  <meta name="description" content="Sign in to TixWave.party to view your QR tickets.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0a;--muted:#a9a3b5;--purple:#7c3aed;--gold:#f59e0b;--green:#22c55e;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.07)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,rgba(124,58,237,.34),transparent 34%),radial-gradient(circle at 88% 15%,rgba(245,158,11,.18),transparent 30%),var(--bg);color:#fff;font-family:Outfit,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1080px,92vw);margin:auto}.nav{border-bottom:1px solid var(--line);background:rgba(10,10,10,.75);backdrop-filter:blur(18px);position:sticky;top:0;z-index:3}.nav .wrap{display:flex;justify-content:space-between;align-items:center;padding:16px 0}.logo{font-size:24px;font-weight:900;letter-spacing:-.04em}.logo span,.gold{color:var(--gold)}.navlinks{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:13px 18px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--purple),#c026d3);cursor:pointer;box-shadow:0 14px 38px rgba(124,58,237,.28)}.btn.secondary{background:var(--glass);border:1px solid var(--line);box-shadow:none}.auth-page{min-height:calc(100vh - 70px);display:grid;grid-template-columns:1fr 440px;gap:36px;align-items:center;padding:58px 0}.eyebrow{color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.11em;font-weight:900}h1{font-size:clamp(44px,8vw,86px);line-height:.88;letter-spacing:-.07em;margin:14px 0}p{color:var(--muted);line-height:1.6;font-size:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:30px;padding:24px;box-shadow:0 34px 100px rgba(0,0,0,.45)}label{display:block;color:var(--muted);font-size:13px;margin:14px 0 7px}input{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--glass);color:white;padding:14px;font:inherit}.form-actions{display:grid;gap:12px;margin-top:18px}.link-btn{border:0;background:transparent;color:var(--gold);font:inherit;font-weight:900;cursor:pointer;padding:0;text-align:left}.msg{min-height:22px;color:var(--muted)}.success{color:#86efac}.error{color:#fca5a5}.fineprint{font-size:14px}.user-chip{color:var(--muted);font-weight:800}.hidden{display:none!important}@media(max-width:820px){.auth-page{grid-template-columns:1fr}.navlinks{font-size:14px}}
  </style>
</head>
<body><nav class="nav"><div class="wrap"><a class="logo" href="index.html">Tix<span>Wave</span>.party</a><div class="navlinks" id="navAuth"><a href="login.html">Sign In</a><a class="btn secondary" href="signup.html">Sign Up</a></div></div></nav><main class="wrap auth-page"><section><div class="eyebrow">Welcome back</div><h1>Your next night out is waiting.</h1><p>Sign in with the email you used at checkout to unlock your QR tickets and keep them ready for the door.</p></section><section class="card"><h2>Sign in</h2><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="form-actions"><button class="btn" id="loginBtn">Sign in</button><button class="link-btn" id="forgotPasswordBtn" type="button">Forgot password?</button><a class="btn secondary" href="signup.html">New to TixWave? Sign up</a></div><p class="msg" id="msg"></p><p class="fineprint">Password reset links bring you back to My Tickets after you set a new password.</p></section></main>
<script>
const SUPABASE_URL='https://nmusxculduptvefgqfjn.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tdXN4Y3VsZHVwdHZlZmdxZmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjcwNDQsImV4cCI6MjEwNTY0MzA0NH0._Nn3nacYJOg2nLcG_kxNSI3vTWtDHUEEH11Lvsera8s';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
function getAuthRedirectUrl(){return `${location.origin}/my-tickets.html`;}
function renderNav(session){navAuth.innerHTML=session?`<span class="user-chip">Hi ${session.user.user_metadata?.name||session.user.email}</span><a href="my-tickets.html">My Tickets</a><button class="btn secondary" id="navSignOut">Sign Out</button>`:`<a href="login.html">Sign In</a><a class="btn secondary" href="signup.html">Sign Up</a>`;if(session)navSignOut.onclick=async()=>{await db.auth.signOut();location.href='index.html';};}
const params=new URLSearchParams(location.search);if(params.get('email'))email.value=params.get('email').trim().toLowerCase();
loginBtn.onclick=async()=>{const cleanEmail=email.value.trim().toLowerCase();const cleanPassword=password.value.trim();if(!cleanEmail.includes('@')){msg.className='msg error';msg.textContent='Enter a valid email.';return;}if(!cleanPassword){msg.className='msg error';msg.textContent='Enter your password.';return;}loginBtn.disabled=true;loginBtn.textContent='Signing in...';const {error}=await db.auth.signInWithPassword({email:cleanEmail,password:cleanPassword});if(error){msg.className='msg error';msg.textContent=error.message;loginBtn.disabled=false;loginBtn.textContent='Sign in';return;}msg.className='msg success';msg.textContent='Signed in. Opening My Tickets...';location.href='my-tickets.html';};
forgotPasswordBtn.onclick=async()=>{const cleanEmail=email.value.trim().toLowerCase();if(!cleanEmail.includes('@')){msg.className='msg error';msg.textContent='Enter your email first, then tap Forgot password.';return;}forgotPasswordBtn.disabled=true;forgotPasswordBtn.textContent='Sending reset link...';const {error}=await db.auth.resetPasswordForEmail(cleanEmail,{redirectTo:getAuthRedirectUrl()});msg.className=error?'msg error':'msg success';msg.textContent=error?error.message:'Password reset email sent. Use the link in your inbox to return to My Tickets.';forgotPasswordBtn.disabled=false;forgotPasswordBtn.textContent='Forgot password?';};
password.addEventListener('keydown',e=>{if(e.key==='Enter')loginBtn.click();});email.addEventListener('keydown',e=>{if(e.key==='Enter')loginBtn.click();});
db.auth.getSession().then(({data:{session}})=>renderNav(session));db.auth.onAuthStateChange((_event,session)=>renderNav(session));
</script></body></html>
