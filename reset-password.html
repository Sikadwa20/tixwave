<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root{--bg:#0a0a0a;--muted:#a9a3b5;--purple:#7c3aed;--gold:#f59e0b;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.07)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 0,rgba(124,58,237,.30),transparent 32%),radial-gradient(circle at 82% 10%,rgba(245,158,11,.16),transparent 28%),var(--bg);color:#fff;font-family:Outfit,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1080px,92vw);margin:auto}.nav{border-bottom:1px solid var(--line);background:rgba(10,10,10,.75);backdrop-filter:blur(18px);position:sticky;top:0;z-index:3}.nav .wrap{display:flex;justify-content:space-between;align-items:center;padding:16px 0}.logo{font-size:24px;font-weight:900;letter-spacing:-.04em}.logo span,.gold{color:var(--gold)}.navlinks{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:13px 18px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--purple),#c026d3);cursor:pointer;box-shadow:0 14px 38px rgba(124,58,237,.28)}.btn.secondary{background:var(--glass);border:1px solid var(--line);box-shadow:none}.auth-page{min-height:calc(100vh - 70px);display:grid;grid-template-columns:1fr 440px;gap:36px;align-items:center;padding:58px 0}.eyebrow{color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.11em;font-weight:900}h1{font-size:clamp(44px,8vw,84px);line-height:.88;letter-spacing:-.07em;margin:14px 0}p{color:var(--muted);line-height:1.6;font-size:18px}.card{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:30px;padding:24px;box-shadow:0 34px 100px rgba(0,0,0,.45)}label{display:block;color:var(--muted);font-size:13px;margin:14px 0 7px}input{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--glass);color:white;padding:14px;font:inherit}.form-actions{display:grid;gap:12px;margin-top:18px}.msg{min-height:22px;color:var(--muted)}.success{color:#86efac}.error{color:#fca5a5}.fineprint{font-size:14px}@media(max-width:820px){.auth-page{grid-template-columns:1fr}.navlinks{font-size:14px}}
  </style>
</head>
<body><nav class="nav"><div class="wrap"><a class="logo" href="index.html">Tix<span>Wave</span>.party</a><div class="navlinks"><a href="login.html">Sign In</a><a class="btn secondary" href="signup.html">Sign Up</a></div></div></nav><main class="wrap auth-page"><section><div class="eyebrow">Password recovery</div><h1>Set a new password and get back to your tickets.</h1><p>Open this page from the password reset email. Once your new password is saved, you can sign in again on TixWave.</p></section><section class="card"><h2>Reset password</h2><p class="fineprint">Use at least 6 characters for your new password.</p><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" placeholder="Create a new password"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your new password"><div class="form-actions"><button class="btn" id="saveBtn">Save new password</button><a class="btn secondary" href="login.html">Back to sign in</a></div><p class="msg" id="msg"></p></section></main>
<script>
const SUPABASE_URL='https://lantiwcpwkfjmqjgvhbg.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbnRpd2Nwd2tmam1xamd2aGJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2ODg5NTcsImV4cCI6MjEwNjI2NDk1N30.nRjyqkPBdXDfitneQpapkqtr66avZyVu8HfCq4pakEs';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let recoveryReady=false;
function setMessage(text,type=''){msg.className=`msg${type?` ${type}`:''}`;msg.textContent=text;}
function getHashParams(){const hash=location.hash.startsWith('#')?location.hash.slice(1):location.hash;return new URLSearchParams(hash);}
async function prepareRecoverySession(){const query=new URLSearchParams(location.search);const hashParams=getHashParams();const errorDescription=query.get('error_description')||hashParams.get('error_description');if(errorDescription){setMessage(decodeURIComponent(errorDescription.replace(/\+/g,' ')),'error');return;}const accessToken=hashParams.get('access_token');const refreshToken=hashParams.get('refresh_token');const type=hashParams.get('type');if(accessToken&&refreshToken){const {error}=await db.auth.setSession({access_token:accessToken,refresh_token:refreshToken});if(error){setMessage(error.message,'error');return;}if(type==='recovery')recoveryReady=true;history.replaceState({},document.title,location.pathname);return;}const {data:{session}}=await db.auth.getSession();if(session)recoveryReady=true;}
db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session)recoveryReady=true;});
saveBtn.onclick=async()=>{const newPassword=password.value.trim();const confirmValue=confirmPassword.value.trim();if(newPassword.length<6){setMessage('Use at least 6 characters for your new password.','error');return;}if(newPassword!==confirmValue){setMessage('Passwords do not match.','error');return;}if(!recoveryReady){setMessage('Open this page from your password reset email, then try again.','error');return;}saveBtn.disabled=true;saveBtn.textContent='Saving...';const {error}=await db.auth.updateUser({password:newPassword});if(error){setMessage(error.message,'error');saveBtn.disabled=false;saveBtn.textContent='Save new password';return;}setMessage('Password updated. You can sign in now. Redirecting to sign in...','success');password.value='';confirmPassword.value='';setTimeout(()=>{location.href='login.html';},1400);};
password.addEventListener('keydown',e=>{if(e.key==='Enter')saveBtn.click();});confirmPassword.addEventListener('keydown',e=>{if(e.key==='Enter')saveBtn.click();});
prepareRecoverySession().then(()=>{if(recoveryReady){setMessage('Reset link confirmed. Enter your new password below.','success');}else if(!msg.textContent){setMessage('Open this page from your password reset email.','');}});
</script></body></html>
